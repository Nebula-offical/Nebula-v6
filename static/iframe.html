<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nebula</title>
  <link rel="icon" type="i/x-icon" href="/i/nebula.png">
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      color: #ccc;
      font-family: monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      overflow: hidden;
    }

    #bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
    }

    #frame {
      width: 90vw;
      height: 80vh;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 6px;
      background: #111;
      display: block;
    }

    .controls {
      display: flex;
      gap: 0.5rem;
    }

    button {
      background: rgba(20, 20, 28, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #888;
      font-family: monospace;
      font-size: 0.8rem;
      padding: 0.4rem 1.1rem;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    button:hover {
      background: rgba(88, 88, 195, 0.2);
      color: #a0a0ff;
      border-color: rgba(88, 88, 195, 0.3);
    }
  </style>
</head>
<body>

  <div id="bg"></div>

  <iframe id="frame" allowfullscreen></iframe>

  <div class="controls">
    <button onclick="reloadFrame()">reload</button>
    <button onclick="fullscreenFrame()">fullscreen</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.cells.min.js"></script>
  <script>
    VANTA.CELLS({
      el: "#bg",
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200.00,
      minWidth: 200.00,
      scale: 1.00,
      color1: 0x0,
      color2: 0x5858c3,
      size: 2.10,
      speed: 1.40
    });

    const params = new URLSearchParams(location.search);
    const src = params.get('url');
    if (src) document.getElementById('frame').src = src;

    function reloadFrame() {
      const f = document.getElementById('frame');
      f.src = f.src;
    }

    function fullscreenFrame() {
      const f = document.getElementById('frame');
      if (f.requestFullscreen) f.requestFullscreen();
      else if (f.webkitRequestFullscreen) f.webkitRequestFullscreen();
      else if (f.mozRequestFullScreen) f.mozRequestFullScreen();
    }
  </script>
</body>
</html>
