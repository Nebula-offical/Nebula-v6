<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon HeartGold - Fullscreen</title>
    <script async src="https://googletagmanager.com"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-L7856P3VNT');
    </script>
    <script>
      window.gameconfig = {
        name: "Pokemon - HeartGold Version (USA)",
        url: "https://jsdelivr.net",
        core: "nds",
        min: 1,
        max: 7,
      };

      function mergeFiles(fileParts, cb) {
        return new Promise((resolve, reject) => {
          let buffers = [];
          function fetchPart(index) {
            if (index >= fileParts.length) {
              let mergedBlob = new Blob(buffers);
              let mergedFileUrl = URL.createObjectURL(mergedBlob);
              resolve(mergedFileUrl);
              return;
            }
            fetch(fileParts[index])
              .then((response) => response.arrayBuffer())
              .then((data) => {
                if (cb) cb(index + 1);
                buffers.push(data);
                fetchPart(index + 1);
              })
              .catch(reject);
          }
          fetchPart(0);
        });
      }

      function getParts(file, start, end) {
        let parts = [];
        for (let i = start; i <= end; i++) {
          let padded = String(i).padStart((end+"").length, '0');
          parts.push(file + ".part" + padded);
        }
        return parts;
      }
    </script>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
      }
      #game-container {
        width: 100vw;
        height: 100vh;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game {
        width: 100% !important;
        height: 100% !important;
      }
      #loading-overlay {
        position: absolute;
        text-align: center;
        color: white;
        z-index: 10;
      }
      #loading-progress {
        font-size: 24px;
        background: rgba(255, 255, 255, 0.1);
        padding: 15px 30px;
        border-radius: 12px;
        margin-bottom: 10px;
      }
      #first-time {
        font-size: 14px;
        opacity: 0.6;
      }
    </style>
</head>
<body>
    <div id="game-container">
      <div id="loading-overlay">
        <div id="loading-progress">Loading: 0/7</div>
        <div id="first-time">First-time loading may take longer...</div>
      </div>
      <div id="game"></div>
    </div>

    <script>
      var parts = getParts(
        window.gameconfig.url,
        window.gameconfig.min,
        window.gameconfig.max
      );
      var totalParts = parts.length;

      function updateLoadingProgress(loaded) {
        const progressElement = document.getElementById("loading-progress");
        progressElement.textContent = `Loading: ${loaded}/${totalParts}`;
      }

      mergeFiles(parts, updateLoadingProgress)
        .then((gameUrl) => {
          document.getElementById("loading-overlay").remove();
          
          window.EJS_player = "#game";
          window.EJS_core = window.gameconfig.core;
          window.EJS_gameName = window.gameconfig.name;
          window.EJS_color = "#0064ff";
          window.EJS_startOnLoaded = true;
          window.EJS_pathtodata = "https://jsdelivr.net";
          window.EJS_gameUrl = gameUrl;

          const script = document.createElement("script");
          script.src = "https://jsdelivr.netloader.js";
          document.body.appendChild(script);
        })
        .catch((error) => {
          console.error(error);
          document.getElementById("loading-progress").textContent = "Error loading game.";
        });
    </script>
</body>
</html>
