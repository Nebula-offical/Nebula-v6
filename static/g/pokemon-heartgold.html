<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon HeartGold - Fullscreen Proxy Fix</title>
    <style>
      body, html {
        margin: 0; padding: 0; width: 100vw; height: 100vh;
        overflow: hidden; background-color: #000;
        display: flex; align-items: center; justify-content: center;
        font-family: Arial, sans-serif;
      }
      #game-container { width: 100vw; height: 100vh; position: relative; }
      #game { width: 100% !important; height: 100% !important; }
      #loading-overlay {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        text-align: center; color: white; z-index: 10;
      }
      #loading-progress {
        font-size: 24px; background: rgba(255, 255, 255, 0.1);
        padding: 15px 30px; border-radius: 12px; margin-bottom: 10px;
      }
    </style>
</head>
<body>
    <div id="game-container">
      <div id="loading-overlay">
        <div id="loading-progress">Loading: 0/7</div>
        <div id="first-time">Loading through Nebula Proxy...</div>
      </div>
      <div id="game"></div>
    </div>

    <script>
      window.gameconfig = {
        name: "Pokemon - HeartGold Version (USA)",
        url: "https://jsdelivr.net",
        core: "nds",
        min: 1,
        max: 7,
      };

      // Set your proxy URL here. Note: We use a generic CORS proxy format 
      // where the target URL is appended to your proxy base.
      const proxyBase = "https://nebula-v6-proxy.vercel.app/atlas/"; 

      async function mergeFiles(fileParts, cb) {
        let buffers = [];
        for (let i = 0; i < fileParts.length; i++) {
          try {
            // Route the request through your proxy to bypass CORS/Network blocks
            const proxyUrl = proxyBase + encodeURIComponent(fileParts[i]);
            const response = await fetch(proxyUrl);
            
            if (!response.ok) throw new Error("Proxy fetch failed");
            
            const data = await response.arrayBuffer();
            buffers.push(data);
            if (cb) cb(i + 1);
          } catch (e) {
            console.error("Error fetching part " + (i + 1), e);
            throw e;
          }
        }
        return URL.createObjectURL(new Blob(buffers));
      }

      function getParts(file, start, end) {
        let parts = [];
        for (let i = start; i <= end; i++) {
          let padded = String(i).padStart(2, '0');
          parts.push(file + ".part" + padded);
        }
        return parts;
      }

      const parts = getParts(window.gameconfig.url, window.gameconfig.min, window.gameconfig.max);

      mergeFiles(parts, (loaded) => {
        document.getElementById("loading-progress").textContent = `Loading: ${loaded}/7`;
      })
      .then((gameUrl) => {
        document.getElementById("loading-overlay").remove();
        
        window.EJS_player = "#game";
        window.EJS_core = window.gameconfig.core;
        window.EJS_gameName = window.gameconfig.name;
        window.EJS_startOnLoaded = true;
        window.EJS_pathtodata = "https://emulatorjs.org";
        window.EJS_gameUrl = gameUrl;

        const script = document.createElement("script");
        script.src = "https://emulatorjs.org";
        document.body.appendChild(script);
      })
      .catch((err) => {
        document.getElementById("loading-progress").textContent = "Proxy Error: Could not reach game files.";
        console.error("Game Load Failure:", err);
      });
    </script>
</body>
</html>
