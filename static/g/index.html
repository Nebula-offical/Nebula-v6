    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {

    #bg {
      position: fixed;
      top: 0; left: 0;

    .search-container {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 1.5rem;
      text-align: center;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
    }

    #gameSearch {
      padding: 12px 24px;
      width: 320px;
      border-radius: 30px;
      border: 1px solid #5858c3;
      background: #111;
      color: #fff;
      font-family: monospace;
      outline: none;
    }

    .grid {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      padding: 1.5rem;
      justify-content: center;
    }

    .grid a {
      display: block;
      border: 1px solid #222;
      overflow: hidden;
      transition: border-color 0.15s, transform 0.15s;
      border-radius: 30px;
    }

    .grid a:hover {
      border-color: #5858c3;
      transform: scale(1.03);
    }

    .grid img {
      display: block;
      height: 180px;
      width: auto;
      border-radius: 30px;
    }

    #noResults {
      display: none;
      text-align: center;
      padding: 2rem;
      font-size: 1.2rem;
      color: #5858c3;
    }
  </style>

  <script>   window.addEventListener('DOMContentLoaded', () => {
      if (typeof VANTA !== 'undefined') {
        VANTA.CELLS({
          el: "#bg",
          mouseControls: true,
          touchControls: true,
          gyroControls: false,
          minHeight: 200.00,
          minWidth: 200.00,
          scale: 1.00,
          color1: 0x0,
          color2: 0x5858c3,
          size: 2.10,
          speed: 1.40
        });
      }
    });

    function filterGames() {
      const input = document.getElementById('gameSearch').value.toLowerCase();
      const links = document.querySelectorAll('.grid a');
      const noResults = document.getElementById('noResults');
      let foundAny = false;
      
      links.forEach(link => {
        const title = link.querySelector('img').alt.toLowerCase();
        if (title.includes(input)) {
          link.style.display = "block";
          foundAny = true;
        } else {
          link.style.display = "none";
        }
      });
      noResults.style.display = foundAny ? "none" : "block";
    }

    document.querySelectorAll('.grid a').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        location.href = '/iframe.html?url=' + encodeURIComponent(a.href);
      });
    });
  </script>
