<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nebula learning</title>
  <link rel="icon" type="i/x-icon" href="/i/nebula.png">
  <link href="https://fonts.googleapis.com/css2?family=Parkinsans:wght@700;800&display=swap" rel="stylesheet">
  <script src="/atlas.register.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      color: #ccc;
      font-family: monospace;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
    }

    .wrap {
      width: 480px;
      padding: 0 1rem;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    .title {
      font-family: 'Parkinsans', sans-serif;
      font-weight: 800;
      font-size: 3rem;
      color: #fff;
      letter-spacing: -0.01em;
      line-height: 1;
    }

    .subtitle {
      font-family: monospace;
      font-size: 0.75rem;
      color: #666;
      letter-spacing: 0.08em;
      text-transform: lowercase;
      margin-bottom: 1.5rem;
    }

    form {
      width: 100%;
      position: relative;
    }

    input {
      width: 100%;
      background: rgba(15, 15, 20, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      color: #e8e8e8;
      font-family: monospace;
      font-size: 0.9rem;
      padding: 0.75rem 1.4rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: rgba(88, 88, 195, 0.6);
      box-shadow: 0 0 0 3px rgba(88, 88, 195, 0.15);
    }

    input::placeholder { color: #444; }
  </style>
</head>
<body>

  <div id="bg"></div>

  <div class="wrap">
    <div class="title">
      <img src="/i/nebula-logo.png" alt="Nebula Logo" style="max-width: 300px; height: auto;">
    </div>
    <div class="subtitle">powered by atlas</div>
    <form id="f">
      <input id="u" type="text" placeholder="search or enter a url." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    </form>
</div>


  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.cells.min.js"></script>
  <script>
    VANTA.CELLS({
      el: "#bg",
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200.00,
      minWidth: 200.00,
      scale: 1.00,
      color1: 0x0,
      color2: 0x5858c3,
      size: 2.10,
      speed: 1.40
    });

    !function(){
      function enc(u){
        try{return btoa(encodeURIComponent(u)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=/g,"")}
        catch(e){return null}
      }
      function norm(s){
        s=s.trim();
        if(!s)return null;
        if(/^https?:\/\//i.test(s)){
          try{new URL(s);return s}catch(e){}
          return null;
        }
        if(/\.|^localhost(:\d+)?$/.test(s)){
          try{new URL("https://"+s);return"https://"+s}catch(e){}
        }
        return"https://duckduckgo.com?q="+encodeURIComponent(s);
      }
      document.getElementById("f").onsubmit=function(e){
        e.preventDefault();
        var v=document.getElementById("u").value;
        var n=norm(v);if(!n)return;
        var c=enc(n);if(!c)return;
        location.href="/atlas/"+c;
      };
    }();
  </script>
</body>
</html>
